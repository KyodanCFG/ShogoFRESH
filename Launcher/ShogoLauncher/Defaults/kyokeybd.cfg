// ShogoFRESH added the Reload action; the engine only knows the actions it
// has been told about, and every AddAction line lives in autoexec.cfg where
// they were written in 1998. Without this, binding R reports "error binding
// device" and the control menu shows Reload permanently unassigned.
AddAction Reload 89
AddAction Holster 85
// Quick melee: swap to melee, swing while held, swap back on release.
AddAction QuickMelee 86
// The secondary-action slot - zoom today, per-weapon secondary fire later.
// Same rule as Reload above: an action the engine has not been told about
// cannot be bound and shows as unassigned in the controls menu.
AddAction SecondaryHold 82
AddAction SecondaryToggle 83

enabledevice "##keyboard"
rangebind "##keyboard" "##11" 0.000000 0.000000 "Weapon_9"
rangebind "##keyboard" "##10" 0.000000 0.000000 "Weapon_8"
rangebind "##keyboard" "##9" 0.000000 0.000000 "Weapon_7"
rangebind "##keyboard" "##8" 0.000000 0.000000 "Weapon_6"
rangebind "##keyboard" "##7" 0.000000 0.000000 "Weapon_5"
rangebind "##keyboard" "##6" 0.000000 0.000000 "Weapon_4"
rangebind "##keyboard" "##5" 0.000000 0.000000 "Weapon_3"
rangebind "##keyboard" "##4" 0.000000 0.000000 "Weapon_2"
rangebind "##keyboard" "##3" 0.000000 0.000000 "Weapon_1"
rangebind "##keyboard" "##2" 0.000000 0.000000 "Weapon_0"
// The same nine 1998 actions ship unbound here as in defkeybd.cfg, and for
// the same reason - see the note there. Unbound, not removed: every one is
// still listed in the controls menu and one click away.
rangebind "##keyboard" "##18" 0.000000 0.000000 "Forward"
rangebind "##keyboard" "##32" 0.000000 0.000000 "Backward"
rangebind "##keyboard" "##44" 0.000000 0.000000 "Duck"
rangebind "##keyboard" "##30" 0.000000 0.000000 "Jump"
rangebind "##keyboard" "##31" 0.000000 0.000000 "StrafeLeft"
rangebind "##keyboard" "##28" 0.000000 0.000000 "SendMessage"
rangebind "##keyboard" "##47" 0.000000 0.000000 "ChaseView"
rangebind "##keyboard" "##45" 0.000000 0.000000 "VehicleModeToggle"
rangebind "##keyboard" "##35" 0.000000 0.000000 "ShowOrdinance"
rangebind "##keyboard" "##66" 0.000000 0.000000 "ScreenShot"
rangebind "##keyboard" "##67" 0.000000 0.000000 "InterfaceToggle"
rangebind "##keyboard" "##15" 0.000000 0.000000 "FragCount"
rangebind "##keyboard" "##62" 0.000000 0.000000 "QuickSave"
rangebind "##keyboard" "##63" 0.000000 0.000000 "QuickLoad"
rangebind "##keyboard" "##42" 0.000000 0.000000 "Speed"
rangebind "##keyboard" "##19" 0.000000 0.000000 "Reload"
rangebind "##keyboard" "##34" 0.000000 0.000000 "Holster"
rangebind "##keyboard" "##16" 0.000000 0.000000 "QuickMelee" 
rangebind "##keyboard" "##33" 0.000000 0.000000 "StrafeRight"
enabledevice "##mouse"
rangebind "##mouse" "Button 3" 0.000000 0.000000 "TractorBeam"
rangebind "##mouse" "Button 1" 0.000000 0.000000 "SecondaryToggle"
rangebind "##mouse" "Button 0" 0.000000 0.000000 "Fire"
rangebind "##mouse" "Wheel" -10000.000000 -0.010000 "NextWeapon" 0.010000 10000.000000 "PrevWeapon"


